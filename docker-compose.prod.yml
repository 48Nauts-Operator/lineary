# Production compose for Coolify deployment.
# - No host port bindings (Coolify's Traefik handles external routing).
# - No source bind-mounts (the built image is authoritative).
# - Frontend is the only service exposed publicly; it proxies /api/ to backend via its own nginx.
# - Postgres + Redis + backend stay on the internal Coolify-managed network.
# - Env vars in ${VAR} form are populated by Coolify's env settings.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lineary_db}
      POSTGRES_USER: ${POSTGRES_USER:-lineary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lineary} -d ${POSTGRES_DB:-lineary_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lineary}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lineary_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STACK_PROJECT_ID: ${STACK_PROJECT_ID}
      STACK_SECRET_SERVER_KEY: ${STACK_SECRET_SERVER_KEY}
    depends_on:
      - postgres
      - redis
    expose:
      - "8000"
    # Use the same node-based probe the Dockerfile declares — no extra deps.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STACK_PROJECT_ID: ${STACK_PROJECT_ID}
    depends_on:
      - backend
    # Coolify's Docker Compose proxy auto-generates a *.rongbuk.net hostname
    # per service (visible in docker_compose_domains on the Application) and
    # injects Traefik labels routing that hostname to whichever service
    # `expose`s the port. Use `expose`, not `ports` — `ports` skips Traefik
    # and binds to the host instead.
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
